stages:
  - format
  - test
  - deploy

python-formatting:
  stage: format
  image: python:3.12
  before_script:
    - pip install flake8
  script:
    - flake8 app.py api/*.py models/*

python-tests:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 30 days
  allow_failure: false

deploy-to-impaas:
  stage: deploy
  needs: ["python-formatting", "python-tests"]
  image: ubuntu:latest
  variables:
    TSURU_TARGET: https://impaas.uk
    APP_NAME: event-calendar
  before_script:
    - apt-get update
    - apt-get install -y curl
    - curl -fsSL "https://tsuru.io/get" | bash
    - export TSURU_TOKEN="$IMPAAS_DEPLOY_TOKEN"
    - tsuru target add impaas "$TSURU_TARGET" -s
  script:
    - tsuru app deploy -a "$APP_NAME" .
  only:
    - master