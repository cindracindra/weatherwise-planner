{% macro icon(name, cls="") -%}
<svg class="icon {{ cls }}" aria-hidden="true" focusable="false"><use href="#i-{{ name }}"></use></svg>
{%- endmacro %}

{#- "HH:MM" from either an ISO string or Flask's HTTP-date ("Wed, 07 Oct 2026 09:30:00 GMT") -#}
{% macro hhmm(value) -%}
  {{- value[11:16] if value[4:5] == "-" else value[17:22] -}}
{%- endmacro %}
