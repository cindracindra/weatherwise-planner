<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style/event_management.css') }}" />
    <title>Event Calendar</title>
  </head>

  <body>
    <header class="header">
      <div class="header__left">
        <h1 class="header__title">Manage your events here!</h1>
      </div>

      <div class="header__right">
        <form action="/" method="get" class="header__home-form">
          <input type="hidden" name="profile_id" value="{{ profile_id }}" />
          <input type="submit" value="HOME" class="header__home-btn" />
        </form>
      </div>
    </header>

    <section class="event-mgmt">
      <!-- LEFT COLUMN: EVENT LIST -->
      <div class="event-mgmt__list">
        {% for day in all_event %}
          <div class="event-list">
            <div class="event-list__day">{{ day.day }}</div>

            {% for event in day.daily_events %}
              <div class="event-item">
                <form action="/management/event/load/{{ event.id }}" method="post" class="event-item__form">
                  <input type="hidden" name="profile_id" value="{{ profile_id }}" />
                  <button type="submit" class="event-item__button">
                    <span class="event-item__title">{{ event.name }}</span><br />
                    <span class="event-item__time">{{ event.start }} - {{ event.end }}</span>
                  </button>
                </form>

                <form action="/management/event/delete/<int:event_id>" method="post" class="event-item__delete-form">
                  <button type="submit" class="event-item__delete-btn" title="Delete event">X</button>
                </form>
              </div>
            {% endfor %}
          </div>
        {% endfor %}
      </div>

      <!-- RIGHT COLUMN: SELECTED EVENT DETAILS -->
      <div class="event-mgmt__details">
        {% if selected_event %}
          <form action="/management/event/update/<int:event_id>" method="post" class="event-details">
            <input type="hidden" name="profile_id" value="{{ profile_id }}" />

            <div class="event-details__row">
              <img src="/static/images/icon-title.png" class="event-details__icon" />
              <input type="text" name="title" class="event-details__input" value="{{ selected_event.name }}" placeholder="Event Title" />
            </div>

            <div class="event-details__row">
              <img src="/static/images/icon-time.png" class="event-details__icon" />
              <input type="text" name="start_time" class="event-details__input" value="{{ selected_event.start }}" placeholder="Start Time" />
              <input type="text" name="end_time" class="event-details__input" value="{{ selected_event.end }}" placeholder="End Time" />
            </div>

            <div class="event-details__row">
              <img src="/static/images/icon-location.png" class="event-details__icon" />
              <input type="text" name="location" class="event-details__input" placeholder="Location" />
            </div>

            <input type="submit" value="Update Event" class="event-details__submit" />
          </form>
        {% else %}
          <form action="/management/event/create" method="post" class="event-details">
            <input type="hidden" name="profile_id" value="{{ profile_id }}" />

            <div class="event-details__row">
              <img src="/static/images/icon-title.png" class="event-details__icon" />
              <input type="text" name="title" class="event-details__input" placeholder="Event Name" />
            </div>

            <div class="event-details__row">
              <img src="/static/images/icon-time.png" class="event-details__icon" />
              <input type="text" name="start_time" class="event-details__input" placeholder="Start Time (HH:MM)" />
              <input type="text" name="end_time" class="event-details__input" placeholder="End Time (HH:MM)" />
            </div>

            <div class="event-details__row">
              <img src="/static/images/icon-location.png" class="event-details__icon" />
              <input type="text" name="location" class="event-details__input" placeholder="Location" />
            </div>

            <input type="submit" value="Create Event" class="event-details__submit" />
          </form>
          <p class="event-details__placeholder">Click an event to see details.</p>
        {% endif %}
      </div>
    </section>
  </body>
</html>
