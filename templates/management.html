<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Management</title>
</head>
<body>
    <h1>Management Page</h1>
    {% if isReqSucc is not none %}
        {% if isReqSucc %}
            <div style="color: green;">Operation was successful!</div>

            <div style="color: red;">Operation failed.</div>

    {% endif %}

</html>
